name: Validate Rivet

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rivet-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: bash scripts/validate-repo.sh

  installer-package-validation:
    name: Debian Trixie installer integration
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20

    steps:
      - name: Install checkout tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the actual Debian Trixie installer stack
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            calamares calamares-settings-debian \
            rsync squashfs-tools sudo pkexec \
            x11-utils x11-xserver-utils python3

      - name: Apply Rivet runtime settings and validate installed package files
        run: |
          install -D -m 0644 \
            build/config/includes.chroot/usr/lib/rivet/check-installer-pipeline.py \
            /usr/lib/rivet/check-installer-pipeline.py

          sed -i \
            -e 's/^[[:space:]]*branding:[[:space:]]*debian[[:space:]]*$/branding: rivet/' \
            -e 's/^[[:space:]]*prompt-install:[[:space:]]*false[[:space:]]*$/prompt-install: true/' \
            -e 's/^[[:space:]]*disable-cancel-during-exec:[[:space:]]*false[[:space:]]*$/disable-cancel-during-exec: true/' \
            /etc/calamares/settings.conf

          python3 /usr/lib/rivet/check-installer-pipeline.py --root /
