name: Build Tip ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "build/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: bash scripts/validate-repo.sh

  build:
    name: Build ISO
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Debian Trixie
        run: |
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates live-build
              bash build/build.sh
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: tip-iso
          path: build/live-image-*.hybrid.iso
          if-no-files-found: error
          retention-days: 7
