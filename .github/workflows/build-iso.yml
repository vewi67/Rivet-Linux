name: Build Rivet ISO

on:
  # One-time, explicitly authorized trigger for the Rivet Linux build #102 release.
  # Ordinary pushes never create ISO releases.
  push:
    branches:
      - rivet-iso102-authorized-once-20261019
  # All other ISO builds remain opt-in. The default confirmation is NO.
  workflow_dispatch:
    inputs:
      authorize_iso:
        description: "Choose YES only when you explicitly authorize generating and publishing a new ISO."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"
      release_number:
        description: "Desired unused release number for rivet-build-N (for example, 102)."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rivet-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate requested release number
        if: inputs.authorize_iso == 'YES' || github.ref == 'refs/heads/rivet-iso102-authorized-once-20261019'
        shell: bash
        env:
          RELEASE_NUMBER: ${{ inputs.release_number || '102' }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: release_number must be a positive integer." >&2
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/rivet-build-${RELEASE_NUMBER}")"
          if [[ -n "$existing_tag" ]]; then
            echo "ERROR: release tag rivet-build-${RELEASE_NUMBER} already exists; choose a new number." >&2
            exit 1
          fi

      - name: Validate repository
        run: bash scripts/validate-repo.sh

  live-build-configuration-validation:
    name: Live-build configuration preflight
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15

    steps:
      - name: Install live-build tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git live-build xorriso file coreutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure live-build without building an ISO
        run: bash build/build.sh --configure-only

  installer-package-validation:
    name: Debian Trixie installer integration
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20

    steps:
      - name: Install checkout tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the complete Rivet package set
        shell: bash
        run: |
          apt-get update
          mapfile -t packages < <(sed '/^[[:space:]]*$/d; /^[[:space:]]*#/d' build/config/package-lists/rivet.list.chroot)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "ERROR: Rivet package list is empty." >&2
            exit 1
          fi
          apt-get -s --install-recommends install "${packages[@]}"

      - name: Install the actual Debian Trixie installer stack
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            calamares calamares-settings-debian \
            rsync squashfs-tools sudo pkexec \
            x11-utils x11-xserver-utils python3 \
            python3-gi gir1.2-gtk-3.0 xvfb xauth

      - name: Apply Rivet runtime settings and validate installed package files
        run: |
          install -D -m 0644 \
            build/config/includes.chroot/usr/lib/rivet/check-installer-pipeline.py \
            /usr/lib/rivet/check-installer-pipeline.py
          install -D -m 0644 \
            build/config/includes.chroot/usr/lib/rivet/configure-calamares-password-policy.py \
            /usr/lib/rivet/configure-calamares-password-policy.py

          sed -i \
            -e 's/^[[:space:]]*branding:[[:space:]]*debian[[:space:]]*$/branding: rivet/' \
            -e 's/^[[:space:]]*prompt-install:[[:space:]]*false[[:space:]]*$/prompt-install: true/' \
            -e 's/^[[:space:]]*disable-cancel-during-exec:[[:space:]]*false[[:space:]]*$/disable-cancel-during-exec: true/' \
            /etc/calamares/settings.conf

          python3 /usr/lib/rivet/configure-calamares-password-policy.py \
            /etc/calamares/modules/users.conf
          install -D -m 0644 \
            build/config/includes.chroot/etc/calamares/branding/rivet/branding.desc \
            /etc/calamares/branding/rivet/branding.desc
          install -D -m 0644 \
            build/config/includes.chroot/etc/calamares/branding/rivet/show.qml \
            /etc/calamares/branding/rivet/show.qml
          sh build/config/hooks/normal/0900-configure-rivet-calamares-slideshow.hook.chroot
          xvfb-run -a python3 scripts/test-welcome-center-gtk.py

  build:
    name: Build ISO
    if: (inputs.authorize_iso == 'YES' && inputs.release_number != '') || github.ref == 'refs/heads/rivet-iso102-authorized-once-20261019'
    needs: [validate, installer-package-validation, live-build-configuration-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Debian Trixie
        run: |
          set -euo pipefail
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates live-build xorriso file coreutils
              bash build/build.sh
            '

      - name: Install ISO validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso file coreutils

      - name: Validate generated ISO and checksum
        run: |
          set -euo pipefail

          shopt -s nullglob
          images=(build/Rivet-Linux.amd64.iso)

          if [[ ${#images[@]} -ne 1 ]]; then
            echo "ERROR: expected exactly one generated ISO, found ${#images[@]}." >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi

          iso="${images[0]}"
          checksum="${iso}.sha256"

          test -s "$iso"
          test -s "$checksum"

          echo "==> ISO file and checksum:"
          ls -lh "$iso" "$checksum"

          echo "==> Verifying SHA-256:"
          (cd build && sha256sum -c "$(basename "$checksum")")

          echo "==> Verifying bootable BIOS and UEFI entries:"
          bash scripts/validate-iso-boot.sh "$iso"

          echo "==> ISO validation passed."

      - name: Prepare GitHub Release assets
        run: |
          set -euo pipefail
          shopt -s nullglob

          images=(build/Rivet-Linux.amd64.iso)
          if [[ ${#images[@]} -ne 1 ]]; then
            echo "ERROR: expected exactly one ISO to prepare for release." >&2
            exit 1
          fi

          iso="${images[0]}"
          iso_name="Rivet-Linux.amd64.iso"
          checksum="${iso}.sha256"
          release_dir="build/release-assets"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          test -s "$checksum"
          cp "$checksum" "$release_dir/"

          # GitHub Releases limits each individual asset to less than 2 GiB.
          # Leave margin and split large ISOs into 1800 MiB chunks.
          size_bytes="$(stat -c '%s' "$iso")"
          asset_limit=$((1800 * 1024 * 1024))
          if (( size_bytes <= asset_limit )); then
            cp "$iso" "$release_dir/$iso_name"
          else
            split_prefix="$release_dir/$iso_name.part-"
            split -b 1800M --numeric-suffixes=0 --suffix-length=2 "$iso" "$split_prefix"
            total_bytes=0
            parts=("$release_dir"/"$iso_name".part-*)
            if [[ ${#parts[@]} -lt 2 ]]; then
              echo "ERROR: large ISO was not split into multiple release parts." >&2
              exit 1
            fi
            for part in "${parts[@]}"; do
              part_bytes="$(stat -c '%s' "$part")"
              if (( part_bytes >= 2 * 1024 * 1024 * 1024 )); then
                echo "ERROR: release part is too large: $part" >&2
                exit 1
              fi
              total_bytes=$((total_bytes + part_bytes))
            done
            if (( total_bytes != size_bytes )); then
              echo "ERROR: split parts do not add up to the ISO size." >&2
              exit 1
            fi
            # The verified split parts replace the large original in the release payload.
            rm "$iso"
          fi

          cat > "$release_dir/reassemble-rivet-iso.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob

          parts=(Rivet-Linux.amd64.iso.part-*)
          if (( ${#parts[@]} > 0 )); then
            iso="${parts[0]%.part-*}"
            echo "Reassembling ${#parts[@]} parts into $iso..."
            cat "${parts[@]}" > "$iso"
          else
            images=(Rivet-Linux.amd64.iso)
            if (( ${#images[@]} != 1 )); then
              echo "ERROR: expected one ISO or a complete set of ISO parts in this directory." >&2
              exit 1
            fi
            iso="${images[0]}"
          fi

          checksum="$iso.sha256"
          if [[ ! -s "$checksum" ]]; then
            echo "ERROR: checksum file is missing: $checksum" >&2
            exit 1
          fi
          sha256sum -c "$checksum"
          echo "ISO ready: $iso"
          SCRIPT
          chmod 0755 "$release_dir/reassemble-rivet-iso.sh"

          cat > "$release_dir/README-DOWNLOAD.txt" <<'README'
          Rivet Linux development ISO

          If the ISO is split into files ending in .part-00, .part-01, etc.,
          download EVERY part, this script, and the matching .sha256 file into
          the same directory. Run:

              bash reassemble-rivet-iso.sh

          The script reconstructs the ISO and verifies its SHA-256 checksum.
          If the release contains a single ISO instead, the same script verifies it.
          README

      - name: Publish ISO as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivet-build-${{ inputs.release_number || '102' }}
          name: "Rivet Linux build #${{ inputs.release_number || '102' }}"
          target_commitish: ${{ github.sha }}
          body: |
            Rivet Linux build #${{ inputs.release_number || '102' }}. This is a pre-alpha development build, not a stable release.
            Source commit: ${{ github.sha }}

            GitHub limits each release asset to less than 2 GiB. If the ISO exceeds
            that limit, download all numbered .part-* files and run
            reassemble-rivet-iso.sh in the same directory to reconstruct and
            verify the ISO. The ISO is published directly in this GitHub Release,
            not as a short-lived Actions artifact.
          prerelease: true
          files: |
            build/release-assets/*
