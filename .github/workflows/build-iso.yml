name: Build Rivet ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "build/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: bash scripts/validate-repo.sh

  build:
    name: Build ISO
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make live-build hooks executable
        run: chmod +x build/config/hooks/normal/*.hook.chroot

      - name: Build inside Debian Trixie
        run: |
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates live-build xorriso
              bash build/build.sh
            '

      - name: Install ISO validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso file

      - name: Validate generated ISO
        run: |
          set -euo pipefail

          shopt -s nullglob
          images=(build/live-image-*.hybrid.iso)

          if [[ ${#images[@]} -ne 1 ]]; then
            echo "ERROR: expected exactly one generated ISO, found ${#images[@]}." >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi

          iso="${images[0]}"

          test -s "$iso"

          echo "==> ISO file:"
          ls -lh "$iso"

          echo "==> ISO metadata:"
          file "$iso"

          echo "==> El Torito boot information:"
          xorriso -indev "$iso" -report_el_torito plain

          echo "==> ISO validation passed."

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: rivet-iso
          path: build/live-image-*.hybrid.iso
          if-no-files-found: error
          retention-days: 7
